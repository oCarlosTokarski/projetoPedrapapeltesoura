<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedra, Papel e Tesoura com DOM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<style>
    body{
        background-color: rgb(25, 25, 25);
        color: white;
        font-family: "Poppins", sans-serif;
    }

    h1 {
        display: flex;
        justify-content: center;
    }

    .container{
        display: flex;
        justify-content: center;
        gap: 100px;
    }
    .container img{
        border-radius: 50%; 
        height: 180px;
        cursor: pointer;
    }


    .botao-movimento{
        background-color: transparent;
        border-radius: 50%;
        padding: 0px;
        border: 2px solid white;
    }


    .resultado{
        display: flex;
        justify-content: center;
        font-size: 25px;
        font-weight: bold;
        margin-top: 40px;
    }

    .movimentos{
        display: flex;
        justify-content: space-evenly;
        margin-top: 90px;
        gap: 40px;
        font-size: 24px;
        font-weight: bold;
    }


    .movimentos img{
        height: 100px;
    }

    .js-score{
        display: flex;
        justify-content: center;
        font-weight: bold;
        margin-top: 120px
    }

    .container-botao{
        display: flex;
        justify-content: center;
    }

    .reset{
        padding: 16px 60px;
        cursor: pointer;
    }

    a{
        text-decoration: none;
        color: aqua;
    }


</style>
<body>
    <h1>Pedra, papel e Tesoura</h1>
    <section class="container">
        <button onclick="

        jogar('Pedra');

            " class="botao-movimento"><img src="multimidia/Pedra-emoji.png" alt="Pedra"></button>
        <button onclick="
        jogar('Papel')
             " class="botao-movimento"><img src="multimidia/Papel-emoji.png" alt="Papel"></button>
        <button onclick="
        jogar('Tesoura');
             " class="botao-movimento"><img src="multimidia/Tesoura-emoji.png" alt="Tesoura"></button>

</section>

<p class="js-resultado resultado">Voce ganhou</p>
<p class="js-movimento movimentos">


</p>
<p class="js-score">

</p>

<div class="container-botao">

    <button onclick="
        score.derrotas = 0;
        score.empates = 0;
        score.vitorias = 0;
        
        localStorage.removeItem('score');
        
        document.querySelector('.js-score')
        .innerHTML = `Vitorias: ${score.vitorias} Derrotas: ${score.derrotas} Empates: ${score.empates}`;
        " class="reset">Resetar pontuação</button>

</div>

<a href="https://ocarlostokarski.github.io/Projetos_js/">Retornar</a>
    
    <script>
    let score = JSON.parse(localStorage.getItem('score')) || {
            vitorias: 0,
            empates: 0,
            derrotas: 0
        }

    scoreElement();
    
    /*if (!score) {
        score = {
            vitorias: 0,
            empates: 0,
            derrotas: 0
        }
    }
*/
    function jogar(movimentoJogador) {
        const movimento = movimentoComputador();

        let resultado = '';

        if (movimentoJogador === 'Pedra') {

            if (movimento === 'Pedra') {
                resultado = 'Empate';
            } else if (movimento === 'Papel') {
                resultado = 'Perdeu';
            } else {
                resultado = 'Ganhou';
            }

        } else if (movimentoJogador === 'Papel') {

            if (movimento === 'Pedra') {
                resultado = 'Ganhou';
            } else if (movimento === 'Papel') {
                resultado = 'Empate';
            } else {
                resultado = 'Perdeu';
            }

        } else if (movimentoJogador === 'Tesoura') {

            if (movimento === 'Pedra') {
                resultado = 'Perdeu';
            } else if (movimento === 'Papel') {
                resultado = 'Ganhou';
            } else {
                resultado = 'Empate';
            }
        }
    
        if (resultado === 'Ganhou'){
            score.vitorias += 1
        } else if (resultado === 'Empate'){
            score.empates += 1
        } else {
            score.derrotas += 1
        }

        localStorage.setItem('score', JSON.stringify(score));
        scoreElement();
        document.querySelector('.js-resultado')
            .innerHTML = resultado


        document.querySelector('.js-movimento')
            .innerHTML = `Voce <img src="multimidia/${movimentoJogador}-emoji.png" alt="">
<img src="multimidia/${movimento}-emoji.png" alt="">
Computador`
    }

    function movimentoComputador() {
        const numeroAleatorio = Math.random();
        let movimento = '';

        if (numeroAleatorio >= 0 && numeroAleatorio < 1 / 3) {
            movimento = 'Pedra';

        } else if (numeroAleatorio >= 1 / 3 && numeroAleatorio < 2 / 3) {
            movimento = 'Papel';

        } else if (numeroAleatorio >= 2 / 3 && numeroAleatorio < 1) {
            movimento = 'Tesoura';
        }

        return movimento;
    }

    function scoreElement(){
        document.querySelector('.js-score')
        .innerHTML = `Vitorias: ${score.vitorias} Derrotas: ${score.derrotas} Empates: ${score.empates}`;
    }
    


</script>
</body>
</html>
